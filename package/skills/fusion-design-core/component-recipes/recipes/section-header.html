.r-section-head__text { display: grid; gap: 2px; min-width: 0; }

.r-section-head__more { flex: none; display: inline-flex; align-items: center; gap: 2px; min-height: 32px; font: 500 14px/1 var(--r-font); color: var(--muted-foreground); text-decoration: none; }
</style>
