<style>
.r-card { display: grid; gap: var(--r-gap-3); padding: var(--r-gap-5); border: 1px solid var(--border); border-radius: var(--r-radius-lg); background: var(--card); color: var(--card-foreground); }
.r-card--flat { border-color: transparent; background: var(--r-fill); }
.r-card--raised { border-color: transparent; box-shadow: var(--r-shadow-md); }
.r-card__head { display: grid; gap: 4px; }
.r-card__title { margin: 0; font: 600 17px/1.3 var(--r-font); letter-spacing: -0.01em; }
.r-card__desc { margin: 0; font: 400 14px/1.5 var(--r-font); color: var(--muted-foreground); }
.r-card__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--r-gap-3); padding-top: var(--r-gap-3); border-top: 1px solid var(--border); }
a.r-card, button.r-card { text-align: left; text-decoration: none; cursor: pointer; transition: transform .15s var(--r-ease), box-shadow .15s var(--r-ease); font: inherit; }
a.r-card:hover, button.r-card:hover { box-shadow: var(--r-shadow-md); }
a.r-card:active, button.r-card:active { transform: scale(.99); }
</style>
<!-- demo -->
<div style="display:grid;gap:16px;max-width:360px">
  <section class="r-card">
    <div class="r-card__head"><h3 class="r-card__title">签证与入境</h3><p class="r-card__desc">美国护照可免签停留 240 小时，需从指定口岸出入境。</p></div>
    <div class="r-card__foot"><span class="r-badge r-badge--soft">已核对 2026-10</span><a class="r-btn r-btn--link" href="#">查看口岸</a></div>
  </section>
  <a class="r-card r-card--raised" href="#">
    <div class="r-card__head"><h3 class="r-card__title">支付准备</h3><p class="r-card__desc">绑定外卡到支付宝，3 分钟完成</p></div>
  </a>
</div>
<!-- /demo -->
