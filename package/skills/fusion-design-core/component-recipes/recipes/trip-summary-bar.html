<style>
.r-summary { display: flex; align-items: center; gap: var(--r-gap-2); margin: 0 var(--r-gap-4); padding: 6px 6px 6px 16px; min-height: 52px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); box-shadow: var(--r-shadow-sm); cursor: pointer; text-align: left; width: calc(100% - 2 * var(--r-gap-4)); color: var(--foreground); }
.r-summary__text { flex: 1; display: grid; gap: 2px; min-width: 0; }
.r-summary__main { font: 600 14px/1.2 var(--r-font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-summary__sub { font: 400 12px/1.2 var(--r-font); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-summary__edit { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); }
</style>
<!-- demo -->
<div style="max-width:390px">
  <button class="r-summary"><span class="r-summary__text"><span class="r-summary__main">北京 · 西安</span><span class="r-summary__sub">4 月 10–15 日 · 2 位成人 · 慢节奏</span></span><span class="r-summary__edit" aria-hidden="true"><span class="r-ico r-ico-sm i-sliders-horizontal"></span></span><span class="r-sr-only">修改条件</span></button>
</div>
<!-- /demo -->
