<style>
.r-sheet {
  position: fixed; inset: auto 0 0 0; width: 100%; max-width: 100%; max-height: 85vh; margin: 0; padding: 0; border: 0;
  border-radius: var(--r-radius-xl) var(--r-radius-xl) 0 0; background: var(--popover); color: var(--popover-foreground); box-shadow: var(--r-shadow-lg);
}
.r-sheet::backdrop { background: var(--r-overlay); }
.r-sheet[open] { animation: r-sheet-in .28s var(--r-ease); }
@keyframes r-sheet-in { from { transform: translateY(100%); } }
.r-sheet__grip { width: 36px; height: 5px; border-radius: 3px; margin: 8px auto 0; background: color-mix(in srgb, var(--foreground) 18%, transparent); }
.r-sheet__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 8px 20px; }
.r-sheet__title { margin: 0; font: 600 17px/1.3 var(--r-font); }
.r-sheet__body { padding: 0 20px 16px; overflow: auto; max-height: calc(85vh - 140px); }
.r-sheet__foot { padding: 12px 20px calc(12px + var(--r-safe-bottom)); border-top: 1px solid var(--border); }
</style>
<!-- demo -->
<button class="r-btn r-btn--outline" data-open="r-sh1">选择旅行节奏</button>
<dialog class="r-sheet" id="r-sh1" aria-labelledby="r-sh1t">
  <div class="r-sheet__grip"></div>
  <div class="r-sheet__head"><h2 class="r-sheet__title" id="r-sh1t">旅行节奏</h2><button class="r-btn r-btn--ghost r-btn--icon r-btn--sm r-btn--round" aria-label="关闭" data-close><span class="r-ico r-ico-sm i-x" aria-hidden="true"></span></button></div>
  <div class="r-sheet__body"><p style="margin:0;color:var(--muted-foreground);font:400 14px/1.6 var(--r-font)">选好之后，每天的景点数量会跟着调整。</p></div>
  <div class="r-sheet__foot"><button class="r-btn r-btn--primary r-btn--lg r-btn--block" data-close>确定</button></div>
</dialog>
<!-- /demo -->
<script>
document.querySelectorAll('[data-open]').forEach(function (b) {
  if (b.dataset.bound) return; b.dataset.bound = '1';
  b.addEventListener('click', function () { var d = document.getElementById(b.dataset.open); d && (d.showModal ? d.showModal() : d.setAttribute('open', '')); });
});
document.querySelectorAll('dialog.r-sheet').forEach(function (d) {
  d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});
</script>
