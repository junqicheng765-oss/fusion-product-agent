  "license": "MIT",
  "states": ["默认", "多目的地横滑（配 carousel）"],
  "use": "旅行首页里的一块主视觉：一张目的地照片，下面一句价值主张和一个入口。入口是去开始自己的行程，不是「就这一个地方」。整页还要另有行程例子或继续入口",
  "dont": "不要把这一块当成整页；不要做成某一个目的地的详情（一张图、一个行程名、一颗「开始这一个」）；不要在这块里铺开出发地、日期、人数多个输入框；不要用渐变色块或插画代替目的地照片",

<style>
.r-dest-hero { display: grid; gap: var(--r-gap-4); padding: 8px var(--r-gap-4) 0; }
.r-dest-hero__media { position: relative; border-radius: var(--r-radius-xl); overflow: hidden; }
.r-dest-hero__img { width: 100%; aspect-ratio: 4 / 5; max-height: 58vh; object-fit: cover; display: block; }
.r-dest-hero__place { position: absolute; left: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .92); color: #111; font: 600 13px/1.2 var(--r-font); }
.r-dest-hero__text { display: grid; gap: 6px; padding: 0 4px; }
.r-dest-hero__title { margin: 0; font: 700 28px/1.15 var(--r-font-display); letter-spacing: -0.02em; text-wrap: balance; }
.r-dest-hero__sub { margin: 0; font: 400 15px/1.5 var(--r-font); color: var(--muted-foreground); }
.r-entry {
  display: flex; align-items: center; gap: var(--r-gap-3); width: 100%; min-height: 56px; padding: 0 8px 0 18px; cursor: pointer; text-align: left;
  border: 1px solid var(--border); border-radius: 999px; background: var(--card); color: var(--foreground); box-shadow: var(--r-shadow-md);
}
.r-entry__text { flex: 1; display: grid; gap: 2px; min-width: 0; }
.r-entry__main { font: 600 15px/1.2 var(--r-font); }
.r-entry__hint { font: 400 13px/1.2 var(--r-font); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-entry__go { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); }
</style>
<!-- demo -->
<section class="r-dest-hero" style="max-width:390px">
  <div class="r-dest-hero__media">
    <img class="r-dest-hero__img" src="preview-assets/photo-1040.jpg" alt="古城建筑">
    <span class="r-dest-hero__place"><span class="r-ico r-ico-sm i-map-pin" aria-hidden="true"></span>平遥古城 · 山西</span>
  </div>
  <div class="r-dest-hero__text"><h1 class="r-dest-hero__title">按你的习惯，排一趟中国之行</h1><p class="r-dest-hero__sub">告诉我们你从哪来、喜欢什么，行程会避开你不习惯的部分。</p></div>
  <button class="r-entry"><span class="r-entry__text"><span class="r-entry__main">想去哪里？</span><span class="r-entry__hint">城市、天数、同行人，一句话说清</span></span><span class="r-entry__go"><span class="r-ico i-sparkles" aria-hidden="true"></span></span></button>
</section>
<!-- /demo -->
