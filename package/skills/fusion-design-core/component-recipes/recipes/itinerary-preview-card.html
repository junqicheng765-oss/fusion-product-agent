<style>
.r-trip { display: grid; gap: 10px; text-decoration: none; color: var(--foreground); }
.r-trip__mosaic { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; aspect-ratio: 16 / 10; border-radius: var(--r-radius-lg); overflow: hidden; }
.r-trip__mosaic img { width: 100%; height: 100%; object-fit: cover; }
.r-trip__mosaic img:first-child { grid-row: span 2; }
.r-trip__title { margin: 0; font: 600 17px/1.3 var(--r-font); }
.r-trip__facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 400 13px/1.4 var(--r-font); color: var(--muted-foreground); }
.r-trip__facts span { display: inline-flex; align-items: center; gap: 5px; }
.r-trip__why { margin: 0; font: 400 14px/1.5 var(--r-font); color: var(--foreground); }
.r-trip__why strong { font-weight: 600; color: var(--primary); }
</style>
<!-- demo -->
<a class="r-trip" href="#" style="max-width:358px">
  <div class="r-trip__mosaic"><img src="preview-assets/photo-1047.jpg" alt="外滩"><img src="preview-assets/photo-1043.jpg" alt="西湖"><img src="preview-assets/photo-1015.jpg" alt="乌镇河道"></div>
  <h3 class="r-trip__title">上海 → 杭州 → 乌镇</h3>
  <div class="r-trip__facts"><span><span class="r-ico r-ico-sm i-calendar" aria-hidden="true"></span>6 天</span><span><span class="r-ico r-ico-sm i-map-pin" aria-hidden="true"></span>14 个地点</span><span>高铁串联</span></div>
  <p class="r-trip__why"><strong>为什么适合你：</strong>每天最多走 8 公里，晚餐都避开 18:30 的排队高峰。</p>
</a>
<!-- /demo -->
