<style>
.r-ai-card { display: grid; gap: var(--r-gap-3); padding: var(--r-gap-4); border: 1px solid var(--border); border-radius: var(--r-radius-xl); background: var(--card); color: var(--card-foreground); }
.r-ai-card__label { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--r-font); color: var(--primary); }
.r-ai-card__title { margin: 0; font: 600 18px/1.3 var(--r-font); }
.r-ai-card__img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--r-radius-lg); }
.r-ai-card__why { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 8px; border-radius: var(--r-radius-lg); background: color-mix(in srgb, var(--primary) 6%, var(--card)); }
.r-ai-card__why li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; font: 400 14px/1.45 var(--r-font); }
.r-ai-card__why li .r-ico { margin-top: 2px; color: var(--primary); }
.r-ai-card__why q { quotes: "“" "”"; color: var(--muted-foreground); }
.r-ai-card__actions { display: flex; gap: var(--r-gap-2); }
.r-ai-card__actions .r-btn:first-child { flex: 1; }
</style>
<!-- demo -->
<article class="r-ai-card" style="max-width:358px">
  <span class="r-ai-card__label"><span class="r-ico r-ico-sm i-sparkles" aria-hidden="true"></span>为你调整过的第 3 天</span>
  <h3 class="r-ai-card__title">颐和园上午 + 下午回酒店休息</h3>
  <img class="r-ai-card__img" src="preview-assets/photo-1043.jpg" alt="湖边园林">
  <ul class="r-ai-card__why" aria-label="为什么适合你">
    <li><span class="r-ico r-ico-sm i-check" aria-hidden="true"></span><span>你说 <q>父母膝盖不好</q>，改走东宫门平路线，全程无台阶</span></li>
    <li><span class="r-ico r-ico-sm i-check" aria-hidden="true"></span><span>你说 <q>中午要午休</q>，13:00 前结束，打车 20 分钟回酒店</span></li>
  </ul>
  <div class="r-ai-card__actions"><button class="r-btn r-btn--primary">用这个安排</button><button class="r-btn r-btn--outline">不合适</button></div>
</article>
<!-- /demo -->
