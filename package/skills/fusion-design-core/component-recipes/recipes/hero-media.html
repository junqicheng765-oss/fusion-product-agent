<style>
.r-hero { position: relative; }
.r-hero__img { width: 100%; height: var(--r-hero-h, 46vh); min-height: 260px; max-height: 480px; object-fit: cover; display: block; }
.r-hero__count { position: absolute; right: 12px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font: 500 12px/1.4 var(--r-font); font-variant-numeric: tabular-nums; }
.r-hero__body { position: relative; margin-top: -16px; padding: 20px 20px 4px; border-radius: var(--r-radius-xl) var(--r-radius-xl) 0 0; background: var(--background); display: grid; gap: 6px; }
.r-hero__eyebrow { font: 600 12px/1.2 var(--r-font); letter-spacing: .06em; text-transform: uppercase; color: var(--primary); }
.r-hero__title { margin: 0; font: 700 26px/1.2 var(--r-font-display); letter-spacing: -0.02em; }
.r-hero__meta { margin: 0; font: 400 14px/1.5 var(--r-font); color: var(--muted-foreground); }
</style>
<!-- demo -->
<div class="r-hero" style="max-width:390px">
  <header class="r-appbar r-appbar--overlay">
    <button class="r-appbar__btn" aria-label="返回"><span class="r-ico i-chevron-left" aria-hidden="true"></span></button>
    <span></span>
    <div class="r-appbar__actions"><button class="r-appbar__btn" aria-label="分享"><span class="r-ico i-share-2" aria-hidden="true"></span></button><button class="r-appbar__btn" aria-label="收藏"><span class="r-ico i-heart" aria-hidden="true"></span></button></div>
  </header>
  <img class="r-hero__img" src="preview-assets/photo-1067.jpg" alt="城市全景">
  <span class="r-hero__count">1 / 12</span>
  <div class="r-hero__body"><span class="r-hero__eyebrow">城市 · 4–5 天</span><h1 class="r-hero__title">成都</h1><p class="r-hero__meta">熊猫基地清晨最安静，川菜可以要求不辣</p></div>
</div>
<!-- /demo -->
