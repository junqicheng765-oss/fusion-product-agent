<style>
.g-table { position: relative; overflow: hidden; background: var(--g-wood); padding: 10px; }
.g-table::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .08), transparent 40%, rgba(0, 0, 0, .25)); pointer-events: none; }
.g-table__felt {
  position: relative; height: 100%; border-radius: 28px; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 45%, color-mix(in srgb, var(--g-felt) 82%, #fff) 0%, var(--g-felt) 45%, var(--g-felt-deep) 100%);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--g-gold) 55%, transparent), inset 0 0 40px rgba(0, 0, 0, .45);
}
.g-table__felt::after {
  content: ""; position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay; pointer-events: none;
  background-image: repeating-radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .35) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .25) 0 1px, transparent 1px 2px);
}
.g-zone { position: absolute; display: grid; place-items: center; }
.g-zone--top { top: 12px; left: 50%; transform: translateX(-50%); }
.g-zone--left { left: 8px; top: 40%; transform: translateY(-50%); }
.g-zone--right { right: 8px; top: 40%; transform: translateY(-50%); }
.g-zone--center { left: 50%; top: 42%; transform: translate(-50%, -50%); }
.g-zone--bottom { left: 0; right: 0; bottom: 0; }
</style>
<!-- demo -->
<div class="g-table" style="max-width:390px;height:360px">
  <div class="g-table__felt">
    <div class="g-zone g-zone--top" data-zone="对家"></div>
    <div class="g-zone g-zone--left" data-zone="上家"></div>
    <div class="g-zone g-zone--right" data-zone="下家"></div>
    <div class="g-zone g-zone--center" data-zone="出牌区"></div>
  </div>
</div>
<!-- /demo -->
