<style>
.g-hand {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding: 18px 12px 6px;
}
.g-hand .g-card {
  --_w: 64px;
  --_h: 90px;
  --_fs: 18px;
  flex: none;
}
.g-hand .g-card + .g-card {
  margin-left: -34px;
}
.g-hand .g-card[aria-pressed="true"] {
  transform: translateY(-14px);
  box-shadow: 0 8px 16px rgba(0, 0, 0, .45), 0 0 0 2px var(--g-gold, #FFD700);
}
</style>
<!-- demo -->
<div style="background:var(--g-felt);border-radius:12px;padding:12px;max-width:640px">
  <div class="g-hand" aria-label="我的手牌">
    <button class="g-card i-suit-heart" data-suit="heart" data-wild="true" aria-label="红桃 5"><span class="g-card__rank">5</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-spade" data-suit="spade" aria-label="黑桃 A"><span class="g-card__rank">A</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-heart" data-suit="heart" aria-label="红桃 K"><span class="g-card__rank">K</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-spade" data-suit="spade" aria-pressed="true" aria-label="黑桃 Q"><span class="g-card__rank">Q</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-heart" data-suit="heart" aria-pressed="true" aria-label="红桃 Q"><span class="g-card__rank">Q</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-diamond" data-suit="diamond" aria-pressed="true" aria-label="方块 Q"><span class="g-card__rank">Q</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-spade" data-suit="spade" aria-pressed="true" aria-label="黑桃 J"><span class="g-card__rank">J</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-heart" data-suit="heart" aria-pressed="true" aria-label="红桃 J"><span class="g-card__rank">J</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
    <button class="g-card i-suit-club" data-suit="club" aria-label="梅花 10"><span class="g-card__rank">10</span><span class="g-card__suit"></span><span class="g-card__pip"></span></button>
  </div>
</div>
<!-- /demo -->
<script>
document.querySelectorAll('.g-hand .g-card').forEach(function (c) {
  c.addEventListener('click', function () { if (c.getAttribute('aria-disabled') === 'true') return; c.setAttribute('aria-pressed', String(c.getAttribute('aria-pressed') !== 'true')); });
});
</script>
