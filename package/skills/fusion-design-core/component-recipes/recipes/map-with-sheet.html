<!-- recipe
{
  "id": "map-with-sheet",
  "name": "地图 + 底部抽屉",
  "tags": ["travel", "mobile-consumer"],
  "source": "按 Google Maps、Citymapper、Airbnb 地图模式做法整理",
  "license": "MIT",
  "states": ["抽屉收起（露标题）", "抽屉半开", "选中地点（标记放大）"],
  "use": "地点要按位置理解时：地图占满背景，列表放在可拖的底部抽屉；标记点带序号和行程顺序对应",
  "dont": "地图必须是真实地图（地图 SDK 或真实瓦片，带版权署名）；不要用手绘或色块冒充地图",
  "icons": ["chevron-left"],
  "requires": ["app-bar", "place-row"],
  "assets": "preview-assets/map-*.png 为 OpenStreetMap 瓦片，仅供预览，© OpenStreetMap contributors（ODbL）；正式页面用高德 / Mapbox / Google Maps SDK"
}
-->
<style>
.r-mapview { position: relative; height: var(--r-mapview-h, 720px); overflow: hidden; background: var(--r-fill); }
.r-mapview__tiles { position: absolute; inset: -40px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
.r-mapview__tiles img { width: 100%; height: 100%; object-fit: cover; display: block; }
.r-mapview__credit { position: absolute; right: 6px; top: 64px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 255, 255, .85); color: #333; font: 400 10px/1.3 var(--r-font); }
.r-pin { position: absolute; transform: translate(-50%, -100%); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50% 50% 50% 0; rotate: -45deg; background: var(--primary); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); border: 2px solid #fff; cursor: pointer; }
.r-pin span { rotate: 45deg; color: var(--primary-foreground); font: 700 12px/1 var(--r-font); }
.r-pin[aria-pressed="true"] { width: 38px; height: 38px; z-index: 2; background: var(--foreground); }
.r-pin[aria-pressed="true"] span { color: var(--background); }
.r-mapview .r-appbar { position: absolute; left: 0; right: 0; top: 0; background: transparent; }
.r-mapview .r-appbar__btn { background: var(--background); box-shadow: var(--r-shadow-md); width: 40px; height: 40px; margin: 4px; }
.r-drawer { position: absolute; left: 0; right: 0; bottom: 0; max-height: 55%; display: grid; grid-template-rows: auto 1fr; border-radius: var(--r-radius-xl) var(--r-radius-xl) 0 0; background: var(--background); box-shadow: var(--r-shadow-lg); transition: transform .3s var(--r-ease); }
.r-drawer[data-state="peek"] { transform: translateY(calc(100% - 84px)); }
.r-drawer__head { padding: 8px 20px 10px; cursor: grab; }
.r-drawer__grip { width: 36px; height: 5px; border-radius: 3px; margin: 0 auto 10px; background: color-mix(in srgb, var(--foreground) 18%, transparent); }
.r-drawer__title { margin: 0; font: 600 17px/1.3 var(--r-font); }
.r-drawer__sub { margin: 2px 0 0; font: 400 13px/1.3 var(--r-font); color: var(--muted-foreground); }
.r-drawer__body { overflow: auto; padding-bottom: var(--r-safe-bottom); }
</style>
<!-- demo -->
<div class="r-mapview" style="max-width:390px;--r-mapview-h:640px">
  <div class="r-mapview__tiles" aria-hidden="true">
    <img src="preview-assets/map-0-0.png" alt=""><img src="preview-assets/map-1-0.png" alt=""><img src="preview-assets/map-2-0.png" alt="">
    <img src="preview-assets/map-0-1.png" alt=""><img src="preview-assets/map-1-1.png" alt=""><img src="preview-assets/map-2-1.png" alt="">
    <img src="preview-assets/map-0-2.png" alt=""><img src="preview-assets/map-1-2.png" alt=""><img src="preview-assets/map-2-2.png" alt="">
  </div>
  <span class="r-mapview__credit">© OpenStreetMap contributors</span>
  <header class="r-appbar"><button class="r-appbar__btn" aria-label="返回"><span class="r-ico i-chevron-left" aria-hidden="true"></span></button><span></span><span></span></header>
  <button class="r-pin" style="left:38%;top:30%" aria-label="地点 1" aria-pressed="true"><span>1</span></button>
  <button class="r-pin" style="left:60%;top:38%" aria-label="地点 2" aria-pressed="false"><span>2</span></button>
  <button class="r-pin" style="left:48%;top:48%" aria-label="地点 3" aria-pressed="false"><span>3</span></button>
  <section class="r-drawer" data-state="open">
    <div class="r-drawer__head"><div class="r-drawer__grip"></div><h3 class="r-drawer__title">第 2 天 · 3 个地点</h3><p class="r-drawer__sub">全程约 6.4 公里，地铁 + 步行</p></div>
    <div class="r-drawer__body">
      <div class="r-place"><img class="r-place__img" src="preview-assets/photo-1040.jpg" alt=""><div class="r-place__body"><span class="r-place__name">1 · 天坛公园</span><span class="r-place__key">09:00 · 停留 2 小时</span></div><span></span></div>
      <div class="r-place"><img class="r-place__img" src="preview-assets/photo-1080.jpg" alt=""><div class="r-place__body"><span class="r-place__name">2 · 四季民福烤鸭</span><span class="r-place__key">11:30 · 午餐</span></div><span></span></div>
    </div>
  </section>
</div>
<!-- /demo -->
<script>
document.querySelectorAll('.r-mapview').forEach(function (m) {
  var pins = m.querySelectorAll('.r-pin'), d = m.querySelector('.r-drawer');
  pins.forEach(function (p) { p.addEventListener('click', function () { pins.forEach(function (x) { x.setAttribute('aria-pressed', String(x === p)); }); d.dataset.state = 'open'; }); });
  m.querySelector('.r-drawer__head').addEventListener('click', function () { d.dataset.state = d.dataset.state === 'open' ? 'peek' : 'open'; });
});
</script>
