<style>
.r-avatar {
  --_s: 40px; position: relative; flex: none; width: var(--_s); height: var(--_s); border-radius: 50%;
  display: inline-grid; place-items: center; overflow: visible;
  background: var(--r-fill); color: var(--muted-foreground); font: 600 calc(var(--_s) * .4)/1 var(--r-font);
}
.r-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; border-radius: 50%; object-fit: cover; }
.r-avatar--sm { --_s: 28px; } .r-avatar--lg { --_s: 56px; }
.r-avatar__status { position: absolute; right: 0; bottom: 0; width: 28%; height: 28%; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 2px var(--background); }
.r-avatar-group { display: inline-flex; }
.r-avatar-group .r-avatar { box-shadow: 0 0 0 2px var(--background); }
.r-avatar-group .r-avatar + .r-avatar { margin-left: calc(var(--_s) * -0.3); }
</style>
