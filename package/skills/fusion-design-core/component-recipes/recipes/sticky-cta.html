<style>
.r-cta {
  position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: var(--r-gap-4);
  padding: 12px 16px calc(12px + var(--r-safe-bottom)); background: var(--background); border-top: 1px solid var(--border);
}
.r-cta__info { display: grid; gap: 2px; min-width: 0; }
.r-cta__main { font: 700 18px/1.2 var(--r-font); font-variant-numeric: tabular-nums; }
.r-cta__sub { font: 400 12px/1.3 var(--r-font); color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-cta .r-btn { flex: none; }
</style>
<!-- demo -->
<div class="r-cta" style="max-width:390px">
  <div class="r-cta__info"><span class="r-cta__main">5 天 · 12 个地点</span><span class="r-cta__sub">保存后可以随时修改</span></div>
  <button class="r-btn r-btn--primary r-btn--lg">保存行程</button>
</div>
<!-- /demo -->
