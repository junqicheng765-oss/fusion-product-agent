<style>
.r-masonry { columns: 2; column-gap: 10px; padding: 0 var(--r-gap-3); }
.r-masonry > * { break-inside: avoid; margin-bottom: 18px; }
.r-masonry .r-photo__img[data-ratio="1"] { aspect-ratio: 1; }
.r-masonry .r-photo__img[data-ratio="4/5"] { aspect-ratio: 4 / 5; }
.r-masonry .r-photo__img[data-ratio="2/3"] { aspect-ratio: 2 / 3; }
</style>
<!-- demo -->
<div class="r-masonry" style="max-width:390px">

  <a class="r-photo" href="#"><img class="r-photo__img" data-ratio="2/3" src="preview-assets/photo-1036.jpg" alt="山景"><span class="r-photo__title">黄山看日出，前一晚住哪</span><span class="r-photo__meta">Tom · 2.7k</span></a>
</div>
