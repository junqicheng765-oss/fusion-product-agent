<!-- recipe
{
  "id": "blur-fade",
  "name": "模糊淡入（进场动效）",
  "tags": ["base", "motion"],
  "source": "改写自 Magic UI Blur Fade（MIT）https://magicui.design/docs/components/blur-fade，去掉 framer-motion 依赖，用 IntersectionObserver",
  "license": "MIT",
  "states": ["未进入视口", "已进入（播放一次）", "减少动效时直接显示"],
  "use": "首屏内容或列表项依次进场；每项延迟 40–80ms，总时长不超过 600ms",
  "dont": "不要给按钮、表单、频繁更新的数据加进场动效",
  "icons": [],
  "demoRequires": ["card"]
}
-->
<style>
.r-fade { opacity: 0; filter: blur(6px); transform: translateY(8px); transition: opacity .5s var(--r-ease), filter .5s var(--r-ease), transform .5s var(--r-ease); transition-delay: calc(var(--i, 0) * 60ms); }
.r-fade[data-in] { opacity: 1; filter: none; transform: none; }
@media (prefers-reduced-motion: reduce) { .r-fade { opacity: 1; filter: none; transform: none; } }
</style>
<!-- demo -->
<div style="display:grid;gap:8px;max-width:360px">
  <div class="r-fade r-card" style="--i:0"><strong>第 1 天</strong>故宫与景山</div>
  <div class="r-fade r-card" style="--i:1"><strong>第 2 天</strong>胡同与什刹海</div>
  <div class="r-fade r-card" style="--i:2"><strong>第 3 天</strong>长城慕田峪段</div>
</div>
<!-- /demo -->
<script>
(function () {
  var els = document.querySelectorAll('.r-fade');
  if (!('IntersectionObserver' in window)) { els.forEach(function (e) { e.dataset.in = '1'; }); return; }
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.dataset.in = '1'; io.unobserve(e.target); } }); }, { threshold: 0.1 });
  els.forEach(function (e) { io.observe(e); });
})();
</script>
