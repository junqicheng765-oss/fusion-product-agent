<style>
.r-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--border); border-radius: var(--r-radius-xl); background: var(--popover); color: var(--popover-foreground); box-shadow: var(--r-shadow-lg); }
.r-dialog::backdrop { background: var(--r-overlay); }
.r-dialog[open] { animation: r-dialog-in .2s var(--r-ease); }
@keyframes r-dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.r-dialog__inner { display: grid; gap: var(--r-gap-3); padding: var(--r-gap-6); position: relative; }
.r-dialog__title { margin: 0; font: 600 18px/1.3 var(--r-font); padding-right: 32px; }
.r-dialog__desc { margin: 0; font: 400 14px/1.6 var(--r-font); color: var(--muted-foreground); }
.r-dialog__actions { display: flex; justify-content: flex-end; gap: var(--r-gap-2); margin-top: var(--r-gap-3); }
.r-dialog__close { position: absolute; top: 12px; right: 12px; }
</style>
<!-- demo -->
<button class="r-btn r-btn--outline" data-open="r-dlg1">删除这个行程</button>
<dialog class="r-dialog" id="r-dlg1" aria-labelledby="r-dlg1t">
  <div class="r-dialog__inner">
    <h2 class="r-dialog__title" id="r-dlg1t">删除「北京 5 日」？</h2>
    <p class="r-dialog__desc">删除后无法恢复，已分享的链接也会失效。</p>
    <div class="r-dialog__actions"><button class="r-btn r-btn--outline" data-close>取消</button><button class="r-btn r-btn--destructive" data-close>删除</button></div>
    <button class="r-btn r-btn--ghost r-btn--icon r-btn--sm r-btn--round r-dialog__close" aria-label="关闭" data-close><span class="r-ico r-ico-sm i-x" aria-hidden="true"></span></button>
  </div>
</dialog>
<!-- /demo -->
<script>
document.querySelectorAll('[data-open]').forEach(function (b) {
  if (b.dataset.bound) return; b.dataset.bound = '1';
  b.addEventListener('click', function () { var d = document.getElementById(b.dataset.open); d && (d.showModal ? d.showModal() : d.setAttribute('open', '')); });
});
document.querySelectorAll('dialog.r-dialog, dialog.r-sheet').forEach(function (d) {
  d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
});
</script>
