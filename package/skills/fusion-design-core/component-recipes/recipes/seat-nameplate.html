<style>
.g-seat { display: grid; justify-items: center; gap: 4px; color: var(--g-ink-on-felt); }
.g-seat__ring { position: relative; padding: 3px; border-radius: 50%; background: rgba(0, 0, 0, .25); }
.g-seat[data-turn] .g-seat__ring { background: conic-gradient(var(--g-gold) var(--_left, 70%), rgba(0, 0, 0, .3) 0); box-shadow: 0 0 14px color-mix(in srgb, var(--g-gold) 60%, transparent); }
.g-seat .r-avatar { --_s: 44px; box-shadow: 0 0 0 2px var(--g-wood); }
.g-seat__plate { display: grid; justify-items: center; gap: 1px; min-width: 72px; padding: 4px 10px 5px; border-radius: 10px; background: linear-gradient(180deg, rgba(0, 0, 0, .55), rgba(0, 0, 0, .4)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--g-gold) 35%, transparent); }
.g-seat__name { font: 600 12px/1.2 var(--r-font); max-width: 9ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-seat__count { font: 800 18px/1 "Roboto Condensed", DIN, var(--r-font); color: var(--g-gold); font-variant-numeric: tabular-nums; }
.g-seat__count small { font: 500 10px/1 var(--r-font); color: var(--g-ink-on-felt-muted); margin-left: 2px; }
.g-seat__team { position: absolute; right: -2px; bottom: -2px; padding: 1px 5px; border-radius: 6px; background: #1E88E5; color: #fff; font: 700 10px/1.3 var(--r-font); }
</style>
